<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BildeFargeApp</title>
    <style>
        /* ── Reset ──────────────────────────────────────────────── */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg:        #111827;
            --surface:   #1f2937;
            --surface2:  #374151;
            --border:    #374151;
            --accent:    #6366f1;
            --accent-h:  #818cf8;
            --text:      #f9fafb;
            --muted:     #9ca3af;
            --r-md:      8px;
            --r-sm:      6px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 14px;
            background: var(--bg);
            color: var(--text);
            height: 100dvh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            -webkit-user-select: none;
            user-select: none;
        }

        /* ── Toolbar ─────────────────────────────────────────────── */
        .toolbar {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px 10px;
            padding: 8px 16px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        .app-name {
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--accent-h);
            margin-right: 2px;
        }

        .sep {
            width: 1px;
            align-self: stretch;
            background: var(--border);
            flex-shrink: 0;
            margin: 2px 0;
        }

        /* Tool toggle group */
        .tool-group {
            display: flex;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--r-md);
            padding: 2px;
            gap: 2px;
        }

        .tool-btn {
            width: 36px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            background: transparent;
            border-radius: var(--r-sm);
            color: var(--muted);
            cursor: pointer;
            transition: background 0.12s, color 0.12s;
        }
        .tool-btn:hover  { background: var(--surface2); color: var(--text); }
        .tool-btn.active { background: var(--accent);   color: #fff; }

        /* Color picker */
        .color-wrap { display: flex; align-items: center; gap: 6px; }
        .color-lbl  { font-size: 0.78rem; color: var(--muted); }

        input[type="color"] {
            -webkit-appearance: none;
            appearance: none;
            width: 44px;
            height: 32px;
            border: 2px solid var(--border);
            border-radius: var(--r-sm);
            background: transparent;
            padding: 1px;
            cursor: pointer;
        }
        input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        input[type="color"]::-webkit-color-swatch         { border-radius: 4px; border: none; }

        /* Slider control */
        .ctrl { display: flex; flex-direction: column; gap: 3px; min-width: 120px; }
        .ctrl-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: var(--muted);
        }
        .ctrl-header output { color: var(--text); font-weight: 600; }
        input[type="range"] {
            width: 100%;
            accent-color: var(--accent);
            cursor: pointer;
        }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            height: 32px;
            padding: 0 12px;
            border: 1px solid var(--border);
            border-radius: var(--r-md);
            background: var(--surface2);
            color: var(--text);
            font-size: 0.82rem;
            cursor: pointer;
            white-space: nowrap;
            transition: background 0.12s, border-color 0.12s, opacity 0.12s;
        }
        .btn:hover:not(:disabled) { background: #4b5563; border-color: var(--accent); }
        .btn:disabled             { opacity: 0.35; cursor: not-allowed; }
        .btn.accent               { background: var(--accent); border-color: var(--accent); }
        .btn.accent:hover:not(:disabled) { background: var(--accent-h); border-color: var(--accent-h); }

        .spacer { flex: 1; min-width: 4px; }

        /* ── Canvas area ─────────────────────────────────────────── */
        .canvas-area {
            flex: 1;
            overflow: hidden;
            position: relative;
            background: var(--bg);
        }
        .canvas-area.drag-over {
            outline: 3px dashed var(--accent);
            outline-offset: -3px;
        }

        /* canvas-wrap is transformed by JS (translate + scale) */
        .canvas-wrap {
            position: absolute;
            top: 0;
            left: 0;
            transform-origin: 0 0;
            box-shadow: 0 4px 30px rgba(0,0,0,0.6);
            border-radius: 4px;
        }

        canvas {
            display: block;
            cursor: crosshair;
            touch-action: none;
        }
        canvas.brush-mode { cursor: none; }

        /* Drop overlay */
        .drop-overlay {
            position: absolute;
            inset: 0;
            background: var(--surface);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: var(--muted);
            border: 2px dashed var(--border);
            border-radius: 4px;
        }
        .drop-overlay.hidden { display: none; }
        .drop-icon { font-size: 2.8rem; margin-bottom: 2px; }
        .drop-overlay p      { font-size: 0.9rem; }
        .drop-overlay .hint  { font-size: 0.72rem; opacity: 0.55; }

        /* Brush cursor ring */
        #brush-cursor {
            position: fixed;
            border: 1.5px solid rgba(255,255,255,0.9);
            border-radius: 50%;
            pointer-events: none;
            display: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 0 1px rgba(0,0,0,0.6);
        }

        /* ── Status bar ──────────────────────────────────────────── */
        .status {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 3px 16px;
            font-size: 0.72rem;
            color: var(--muted);
            background: var(--surface);
            border-top: 1px solid var(--border);
            flex-shrink: 0;
        }

        /* ── Responsive ──────────────────────────────────────────── */
        @media (max-width: 640px) {
            .app-name { display: none; }
            .toolbar  { padding: 6px 8px; gap: 4px 6px; }
            .btn span { display: none; }
        }
    </style>
</head>
<body>

<!-- ── Toolbar ──────────────────────────────────────────────────── -->
<header class="toolbar" role="toolbar" aria-label="Main toolbar">
    <span class="app-name">BildeFargeApp</span>
    <div class="sep"></div>

    <!-- Tool selector -->
    <div class="tool-group" role="group" aria-label="Drawing tools">
        <button class="tool-btn active" id="btn-bucket" title="Bucket fill — B">
            <!-- Paint bucket icon -->
            <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M16.56 8.94L7.62 0 6.21 1.41l2.38 2.38-5.15 5.15a1.49 1.49 0 0 0 0 2.12l5.5 5.5c.29.29.68.44 1.06.44s.77-.15 1.06-.44l5.5-5.5c.59-.58.59-1.53 0-2.12zM5.21 10 10 5.21 14.79 10H5.21zM19 11.5s-2 2.17-2 3.5c0 1.1.9 2 2 2s2-.9 2-2c0-1.33-2-3.5-2-3.5z"/>
                <path d="M0 20h24v4H0z" opacity=".3"/>
            </svg>
        </button>
        <button class="tool-btn" id="btn-brush" title="Brush — R">
            <!-- Brush icon -->
            <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M7 14c-1.66 0-3 1.34-3 3 0 1.31-1.16 2-2 2 .92 1.22 2.49 2 4 2 2.21 0 4-1.79 4-4 0-1.66-1.34-3-3-3zm13.71-9.37-1.34-1.34a1 1 0 0 0-1.41 0L9 12.25 11.75 15l8.96-8.96a1 1 0 0 0 0-1.41z"/>
            </svg>
        </button>
        <button class="tool-btn" id="btn-polygon"
                title="Polygon fill — P  (click/tap to add points · snap to start or Enter to fill · Esc to cancel)">
            <!-- Pentagon outline -->
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true">
                <polygon points="12,3 21,9 17.5,20 6.5,20 3,9"/>
            </svg>
        </button>
        <button class="tool-btn" id="btn-ellipse" title="Ellipse fill — E  (drag to draw)">
            <!-- Ellipse outline -->
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" aria-hidden="true">
                <ellipse cx="12" cy="12" rx="10" ry="6"/>
            </svg>
        </button>
    </div>

    <div class="sep"></div>

    <!-- Color picker -->
    <div class="color-wrap">
        <span class="color-lbl">Color</span>
        <input type="color" id="color-picker" value="#e94560" title="Pick fill / brush color">
    </div>

    <div class="sep"></div>

    <!-- Opacity (applies to all tools) -->
    <div class="ctrl">
        <div class="ctrl-header">
            <span>Opacity</span>
            <output id="opacity-out">100</output>%
        </div>
        <input type="range" id="opacity-range" min="1" max="100" value="100" aria-label="Paint opacity">
    </div>

    <div class="sep"></div>

    <!-- Tolerance (bucket) -->
    <div class="ctrl" id="ctrl-tolerance">
        <div class="ctrl-header">
            <span>Tolerance</span>
            <output id="tol-out">20</output>
        </div>
        <input type="range" id="tol-range" min="0" max="100" value="20" aria-label="Fill tolerance">
    </div>

    <!-- Brush size (brush) — hidden by default -->
    <div class="ctrl" id="ctrl-brush" style="display:none">
        <div class="ctrl-header">
            <span>Brush size</span>
            <output id="size-out">20</output>px
        </div>
        <input type="range" id="size-range" min="1" max="200" value="20" aria-label="Brush size in display pixels">
    </div>

    <div class="spacer"></div>

    <!-- Action buttons -->
    <button class="btn" id="btn-upload" title="Upload image — Ctrl+O">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M9 16h6v-6h4l-7-7-7 7h4v6zm-4 2h14v2H5v-2z"/>
        </svg>
        <span>Upload</span>
    </button>
    <input type="file" id="file-input" accept="image/*" aria-label="Upload image" hidden>

    <button class="btn" id="btn-undo" title="Undo — Ctrl+Z" disabled>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.16 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z"/>
        </svg>
        <span>Undo</span>
    </button>
    <button class="btn" id="btn-redo" title="Redo — Ctrl+Y" disabled>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M18.4 10.6C16.55 8.99 14.15 8 11.5 8c-4.65 0-8.58 3.03-9.96 7.22L3.9 16c1.05-3.19 4.05-5.5 7.6-5.5 1.95 0 3.73.72 5.12 1.88L13 16h9V7l-3.6 3.6z"/>
        </svg>
        <span>Redo</span>
    </button>

    <!-- Shown only while a polygon/ellipse shape is pending adjustment -->
    <button class="btn" id="btn-cancel-shape" title="Cancel shape (Esc)" style="display:none">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
        </svg>
        <span>Cancel</span>
    </button>
    <button class="btn accent" id="btn-apply" title="Apply shape (Enter)" style="display:none">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/>
        </svg>
        <span>Apply</span>
    </button>

    <button class="btn accent" id="btn-download" title="Download PNG — Ctrl+S" disabled>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M19 9h-4V3H9v6H5l7 7 7-7zm-8 2V5h2v6h1.17L12 13.17 9.83 11H11zm-6 8h14v2H5v-2z"/>
        </svg>
        <span>Download</span>
    </button>
</header>

<!-- ── Canvas area ───────────────────────────────────────────────── -->
<main class="canvas-area" id="canvas-area">
    <!-- Drop overlay — covers area before an image is loaded -->
    <div class="drop-overlay" id="drop-overlay">
        <div class="drop-icon">🖼️</div>
        <p>Drop an image here</p>
        <p class="hint">or</p>
        <button class="btn accent" id="btn-pick">Choose file…</button>
        <p class="hint">JPG · PNG · WebP · GIF · BMP</p>
    </div>

    <!-- Canvas — pixel dimensions set dynamically when image loads -->
    <div class="canvas-wrap" id="canvas-wrap">
        <canvas id="canvas" width="1" height="1"></canvas>
        <!-- Transparent overlay for shape previews; pointer-events:none so all clicks reach the main canvas -->
        <canvas id="overlay" width="1" height="1" style="position:absolute;top:0;left:0;pointer-events:none"></canvas>
    </div>
</main>

<!-- Brush-size cursor ring (follows mouse on desktop) -->
<div id="brush-cursor" aria-hidden="true"></div>

<!-- ── Status bar ────────────────────────────────────────────────── -->
<footer class="status" role="status" aria-live="polite">
    <span id="st-tool">Tool: Bucket fill</span>
    <span>·</span>
    <span id="st-size">No image loaded</span>
    <span>·</span>
    <span id="st-pos"></span>
    <span style="margin-left:auto" id="st-zoom"></span>
    <span id="st-undo"></span>
</footer>

<script>
'use strict';

/* ── Element references ───────────────────────────────────────── */
const canvas      = document.getElementById('canvas');
const ctx         = canvas.getContext('2d', { willReadFrequently: true });
const overlay     = document.getElementById('overlay');
const overlayCtx  = overlay.getContext('2d');
const canvasArea  = document.getElementById('canvas-area');
const canvasWrap  = document.getElementById('canvas-wrap');
const dropOverlay = document.getElementById('drop-overlay');
const brushCursor = document.getElementById('brush-cursor');
const fileInput   = document.getElementById('file-input');

const colorPicker  = document.getElementById('color-picker');
const opacityRange = document.getElementById('opacity-range');
const opacityOut   = document.getElementById('opacity-out');
const tolRange     = document.getElementById('tol-range');
const tolOut      = document.getElementById('tol-out');
const sizeRange   = document.getElementById('size-range');
const sizeOut     = document.getElementById('size-out');

const btnBucket   = document.getElementById('btn-bucket');
const btnBrush    = document.getElementById('btn-brush');
const btnPolygon  = document.getElementById('btn-polygon');
const btnEllipse  = document.getElementById('btn-ellipse');
const btnApply    = document.getElementById('btn-apply');
const btnCancelShape = document.getElementById('btn-cancel-shape');
const btnUpload   = document.getElementById('btn-upload');
const btnUndo     = document.getElementById('btn-undo');
const btnRedo     = document.getElementById('btn-redo');
const btnDownload = document.getElementById('btn-download');
const btnPick     = document.getElementById('btn-pick');

const ctrlTolerance = document.getElementById('ctrl-tolerance');
const ctrlBrush     = document.getElementById('ctrl-brush');

const stTool = document.getElementById('st-tool');
const stSize = document.getElementById('st-size');
const stPos  = document.getElementById('st-pos');
const stUndo = document.getElementById('st-undo');

/* ── Application state ────────────────────────────────────────── */
let imageLoaded  = false;
let currentTool  = 'bucket';  // 'bucket' | 'brush' | 'polygon' | 'ellipse'
let isDrawing    = false;
let lastPos      = null;      // last brush stroke position (canvas px)
let lastKnownPos = null;      // last canvas position seen in onMove

const MAX_UNDO  = 25;
const undoStack = [];          // Array<ImageData>
const redoStack = [];          // Array<ImageData>

/* ── Shape tool state ─────────────────────────────────────────── */
let polygonPts      = [];    // Array<{x,y}> placed polygon vertices (canvas coords)
let polygonDraftActive = false; // true while the last polygon point is still being dragged into position (mobile)
let ellipseStart = null;  // {x,y} drag-start of current ellipse (canvas coords)

/* ── Pending shape (adjust mode) ─────────────────────────────── */
// After closing a polygon or releasing an ellipse drag the shape enters
// adjust mode — it is not yet committed to the main canvas.
let pendingShape    = null;  // { type:'polygon', pts, color } | { type:'ellipse', cx,cy,rx,ry, color }
let adjustDragIdx   = -1;    // index of handle currently being dragged
let adjustDragStart = null;  // { x, y } canvas coords when drag began
let adjustOrigShape = null;  // deep-copy of pendingShape at drag start

/* ── View state (zoom / pan) ──────────────────────────────────── */
let viewX = 0, viewY = 0, viewScale = 1;
let prevPinch = null;   // { p1, p2 } — previous 2-finger touch positions
let tapTimer  = null;   // double-tap timer (resets view)

/* ── Image loading ────────────────────────────────────────────── */
function loadImage(file) {
    if (!file || !file.type.startsWith('image/')) return;
    const reader = new FileReader();
    reader.onload = ({ target }) => {
        const img = new Image();
        img.onload = () => {
            canvas.width  = img.naturalWidth;
            canvas.height = img.naturalHeight;
            overlay.width  = img.naturalWidth;
            overlay.height = img.naturalHeight;
            ctx.drawImage(img, 0, 0);
            imageLoaded      = true;
            undoStack.length = 0;
            redoStack.length = 0;
            dropOverlay.classList.add('hidden');
            initView();   // fit & center the newly loaded image
            refresh();
        };
        img.onerror = () => alert('Could not load image.');
        img.src = target.result;
    };
    reader.readAsDataURL(file);
}

/* ── Canvas coordinate mapping ────────────────────────────────── */
// Maps a mouse/touch event position to actual canvas pixel coordinates.
// Handles CSS scaling (canvas rendered smaller than its pixel size).
function getPos(e) {
    const rect   = canvas.getBoundingClientRect();
    const scaleX = canvas.width  / rect.width;
    const scaleY = canvas.height / rect.height;
    const src    = e.touches ? e.touches[0] : e;
    return {
        x:  Math.round((src.clientX - rect.left) * scaleX),
        y:  Math.round((src.clientY - rect.top)  * scaleY),
        cx: src.clientX,   // client coords for brush cursor ring
        cy: src.clientY
    };
}

/* ── Undo / Redo ──────────────────────────────────────────────── */
function saveState() {
    if (undoStack.length >= MAX_UNDO) undoStack.shift();
    undoStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
    redoStack.length = 0;
    refresh();
}

function undo() {
    if (!undoStack.length) return;
    redoStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
    ctx.putImageData(undoStack.pop(), 0, 0);
    refresh();
}

function redo() {
    if (!redoStack.length) return;
    undoStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
    ctx.putImageData(redoStack.pop(), 0, 0);
    refresh();
}

/* ── Flood fill ───────────────────────────────────────────────── */
function hexToRgb(hex) {
    const v = parseInt(hex.replace('#', ''), 16);
    return [(v >> 16) & 255, (v >> 8) & 255, v & 255];
}

function floodFill(startX, startY) {
    const [fillR, fillG, fillB] = hexToRgb(colorPicker.value);
    const W = canvas.width, H = canvas.height;

    if (startX < 0 || startX >= W || startY < 0 || startY >= H) return;

    const imageData = ctx.getImageData(0, 0, W, H);
    const data      = imageData.data;
    const si        = (startY * W + startX) * 4;
    const seedR = data[si], seedG = data[si + 1], seedB = data[si + 2];

    // Nothing to do — clicked pixel already has the fill color
    if (seedR === fillR && seedG === fillG && seedB === fillB) return;

    saveState();

    // Max possible Euclidean distance in RGB space ≈ 441.67; scale tolerance to that range
    const tol     = (Number(tolRange.value) / 100) * 442;
    const total   = W * H;
    const visited = new Uint8Array(total);  // bit-flag per pixel (12 MB for 12 MP)
    const stack   = [];                     // DFS stack (grows on demand)

    // Pre-compute opacity blend factors once (avoids repeated slider reads in the hot loop)
    const fillA  = Number(opacityRange.value) / 100;
    const fillIA = 1 - fillA;
    const fullOpacity = fillA >= 1;

    const startPx = startY * W + startX;
    stack.push(startPx);
    visited[startPx] = 1;

    while (stack.length) {
        const pos = stack.pop();
        const di  = pos * 4;

        // Reject if color is outside tolerance
        const dr = data[di]     - seedR;
        const dg = data[di + 1] - seedG;
        const db = data[di + 2] - seedB;
        if (Math.sqrt(dr * dr + dg * dg + db * db) > tol) continue;

        // Paint pixel — blend with original if opacity < 100 %
        if (fullOpacity) {
            data[di]     = fillR;
            data[di + 1] = fillG;
            data[di + 2] = fillB;
            data[di + 3] = 255;
        } else {
            data[di]     = Math.round(fillR * fillA + data[di]     * fillIA);
            data[di + 1] = Math.round(fillG * fillA + data[di + 1] * fillIA);
            data[di + 2] = Math.round(fillB * fillA + data[di + 2] * fillIA);
            data[di + 3] = Math.round(255   * fillA + data[di + 3] * fillIA);
        }

        const x = pos % W;
        const y = (pos / W) | 0;

        if (x > 0   && !visited[pos - 1]) { visited[pos - 1] = 1; stack.push(pos - 1); }
        if (x < W-1 && !visited[pos + 1]) { visited[pos + 1] = 1; stack.push(pos + 1); }
        if (y > 0   && !visited[pos - W]) { visited[pos - W] = 1; stack.push(pos - W); }
        if (y < H-1 && !visited[pos + W]) { visited[pos + W] = 1; stack.push(pos + W); }
    }

    ctx.putImageData(imageData, 0, 0);
}

/* ── Brush ────────────────────────────────────────────────────── */
// Convert the slider's display-pixel radius to actual canvas pixels,
// so the brush appears the same physical size regardless of image resolution.
function brushRadiusPx() {
    const displayR = Number(sizeRange.value) / 2;
    const rect     = canvas.getBoundingClientRect();
    return Math.max(0.5, displayR * (canvas.width / rect.width));
}

function drawBrush(x, y) {
    const r = brushRadiusPx();
    ctx.globalAlpha = Number(opacityRange.value) / 100;
    ctx.fillStyle   = colorPicker.value;
    ctx.strokeStyle = colorPicker.value;
    ctx.lineCap     = 'round';
    ctx.lineJoin    = 'round';
    ctx.lineWidth   = r * 2;

    ctx.beginPath();
    if (lastPos) {
        // Interpolate between previous and current position to fill gaps on fast moves
        ctx.moveTo(lastPos.x, lastPos.y);
        ctx.lineTo(x, y);
        ctx.stroke();
    } else {
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;
    lastPos = { x, y };
}

/* ── Overlay canvas (shape preview) ──────────────────────────── */
function clearOverlay() {
    overlayCtx.clearRect(0, 0, overlay.width, overlay.height);
}

/* ── Pending shape: adjust mode helpers ───────────────────────── */

// Returns the 9 drag handles for an ellipse shape (8 edges + centre).
function getEllipseHandles(s) {
    const { cx, cy, rx, ry } = s;
    return [
        { x: cx,    y: cy-ry, t: 'n'  },
        { x: cx+rx, y: cy-ry, t: 'ne' },
        { x: cx+rx, y: cy,    t: 'e'  },
        { x: cx+rx, y: cy+ry, t: 'se' },
        { x: cx,    y: cy+ry, t: 's'  },
        { x: cx-rx, y: cy+ry, t: 'sw' },
        { x: cx-rx, y: cy,    t: 'w'  },
        { x: cx-rx, y: cy-ry, t: 'nw' },
        { x: cx,    y: cy,    t: 'c'  },  // centre — move whole ellipse
    ];
}

// Returns the index of the handle under (x,y), or -1 if none.
function hitTestHandles(x, y) {
    if (!pendingShape) return -1;
    const hitR    = Math.max(6, 12 / viewScale);   // 12 display-px hit radius
    const handles = pendingShape.type === 'polygon'
        ? pendingShape.pts
        : getEllipseHandles(pendingShape);
    for (let i = 0; i < handles.length; i++) {
        if (Math.hypot(x - handles[i].x, y - handles[i].y) < hitR) return i;
    }
    return -1;
}

// Applies the drag delta to the pending shape.
function applyAdjustDrag(x, y) {
    if (!pendingShape || adjustDragIdx === -1 || !adjustOrigShape) return;
    if (pendingShape.type === 'polygon') {
        const orig = adjustOrigShape.pts[adjustDragIdx];
        const dx = x - adjustDragStart.x;
        const dy = y - adjustDragStart.y;
        pendingShape.pts[adjustDragIdx] = { x: orig.x + dx, y: orig.y + dy };
    } else {
        const handles = getEllipseHandles(adjustOrigShape);
        const ht = handles[adjustDragIdx].t;
        const { cx, cy, rx, ry } = adjustOrigShape;
        if (ht === 'c') {
            pendingShape.cx = cx + (x - adjustDragStart.x);
            pendingShape.cy = cy + (y - adjustDragStart.y);
        } else {
            let t = cy - ry, b = cy + ry, l = cx - rx, r = cx + rx;
            if (ht === 'n'  || ht === 'ne' || ht === 'nw') t = y;
            if (ht === 's'  || ht === 'se' || ht === 'sw') b = y;
            if (ht === 'e'  || ht === 'ne' || ht === 'se') r = x;
            if (ht === 'w'  || ht === 'nw' || ht === 'sw') l = x;
            if (r - l < 4) r = l + 4;
            if (b - t < 4) b = t + 4;
            pendingShape.cx = (l + r) / 2;
            pendingShape.cy = (t + b) / 2;
            pendingShape.rx = (r - l) / 2;
            pendingShape.ry = (b - t) / 2;
        }
    }
}

// Redraws the pending shape (semi-transparent fill + dashed border + handles).
function drawPendingShape() {
    clearOverlay();
    if (!pendingShape) return;
    const [r, g, b] = hexToRgb(pendingShape.color);
    const lw      = Math.max(0.5, 1.5 / viewScale);
    const dashLen = Math.max(2, 5 / viewScale);
    const hr      = Math.max(2, 7 / viewScale);

    overlayCtx.save();
    overlayCtx.lineWidth   = lw;
    overlayCtx.setLineDash([dashLen, dashLen]);
    overlayCtx.strokeStyle = 'rgba(255,255,255,0.9)';
    overlayCtx.shadowColor = 'rgba(0,0,0,0.55)';
    overlayCtx.shadowBlur  = 3 / viewScale;
    overlayCtx.beginPath();
    if (pendingShape.type === 'polygon') {
        pendingShape.pts.forEach((p, i) =>
            i === 0 ? overlayCtx.moveTo(p.x, p.y) : overlayCtx.lineTo(p.x, p.y));
        overlayCtx.closePath();
    } else {
        const { cx, cy, rx, ry } = pendingShape;
        overlayCtx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
    }
    overlayCtx.fillStyle = `rgba(${r},${g},${b},${Math.min(0.85, Number(opacityRange.value) / 100 * 0.85).toFixed(2)})`;
    overlayCtx.fill();
    overlayCtx.stroke();
    overlayCtx.restore();

    // Draw handles
    const handles = pendingShape.type === 'polygon'
        ? pendingShape.pts
        : getEllipseHandles(pendingShape);
    handles.forEach((h, i) => {
        const isCentre   = pendingShape.type === 'ellipse' && h.t === 'c';
        const isDragging = i === adjustDragIdx;
        overlayCtx.beginPath();
        overlayCtx.arc(h.x, h.y, hr * (isCentre ? 0.65 : 1), 0, Math.PI * 2);
        overlayCtx.fillStyle   = isDragging ? pendingShape.color : '#fff';
        overlayCtx.fill();
        overlayCtx.lineWidth   = lw;
        overlayCtx.strokeStyle = 'rgba(0,0,0,0.5)';
        overlayCtx.stroke();
    });
}

// Commits the pending shape to the main canvas.
function applyPendingShape() {
    if (!pendingShape) return;
    saveState();
    ctx.globalAlpha = Number(opacityRange.value) / 100;
    ctx.fillStyle = pendingShape.color;
    ctx.beginPath();
    if (pendingShape.type === 'polygon') {
        pendingShape.pts.forEach((p, i) =>
            i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y));
        ctx.closePath();
    } else {
        const { cx, cy, rx, ry } = pendingShape;
        ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
    }
    ctx.fill();
    ctx.globalAlpha = 1;
    cancelPendingShape();
}

// Discards the pending shape without filling.
function cancelPendingShape() {
    pendingShape    = null;
    adjustDragIdx   = -1;
    adjustDragStart = null;
    adjustOrigShape = null;
    clearOverlay();
    updateAdjustUI();
}

// Shows/hides the Apply & Cancel buttons and updates the status hint.
function updateAdjustUI() {
    const active = !!pendingShape;
    btnApply.style.display       = active ? '' : 'none';
    btnCancelShape.style.display = active ? '' : 'none';
    if (active) {
        stTool.textContent  = 'Adjust — drag handles to modify · Enter or Apply to fill · Esc to cancel';
        canvas.style.cursor = 'default';
    } else {
        stTool.textContent  = TOOL_HINTS[currentTool] || currentTool;
        canvas.style.cursor = '';
        canvas.classList.toggle('brush-mode', currentTool === 'brush');
    }
}

/* ── Polygon tool ─────────────────────────────────────────────── */
// Redraws the in-progress polygon on the overlay canvas.
// cx, cy = current cursor position in canvas pixels (null = no cursor)
function drawPolygonPreview(cx, cy) {
    clearOverlay();
    if (polygonPts.length === 0) return;

    // Keep handles a constant screen size regardless of zoom level
    const hr      = Math.max(1.5, 6 / viewScale);
    const lw      = Math.max(0.5, 1.5 / viewScale);
    const dashLen = Math.max(2, 5 / viewScale);

    // Snap to first point when within 15 display pixels
    const rect  = canvas.getBoundingClientRect();
    const snapT = 15 * (canvas.width / rect.width);
    const nearFirst = cx !== null && polygonPts.length >= 3 &&
        Math.hypot(cx - polygonPts[0].x, cy - polygonPts[0].y) < snapT;
    const tx = nearFirst ? polygonPts[0].x : cx;
    const ty = nearFirst ? polygonPts[0].y : cy;

    overlayCtx.save();
    overlayCtx.lineWidth   = lw;
    overlayCtx.strokeStyle = 'rgba(255,255,255,0.9)';
    overlayCtx.setLineDash([dashLen, dashLen]);
    overlayCtx.shadowColor = 'rgba(0,0,0,0.55)';
    overlayCtx.shadowBlur  = 3 / viewScale;
    overlayCtx.beginPath();
    polygonPts.forEach((p, i) =>
        i === 0 ? overlayCtx.moveTo(p.x, p.y) : overlayCtx.lineTo(p.x, p.y));
    if (tx !== null) overlayCtx.lineTo(tx, ty);
    overlayCtx.stroke();
    overlayCtx.restore();

    // Draw point handles
    polygonPts.forEach((p, i) => {
        const snap    = i === 0 && nearFirst;
        const isDraft = polygonDraftActive && i === polygonPts.length - 1;
        overlayCtx.beginPath();
        overlayCtx.arc(p.x, p.y, hr * (snap ? 1.8 : isDraft ? 2.2 : 1), 0, Math.PI * 2);
        overlayCtx.fillStyle   = (snap || isDraft) ? colorPicker.value : '#fff';
        overlayCtx.fill();
        overlayCtx.lineWidth   = lw;
        overlayCtx.strokeStyle = i === 0 ? colorPicker.value : 'rgba(0,0,0,0.45)';
        overlayCtx.stroke();
        // Pulsing outer ring on the draft point so the user knows it’s still moveable
        if (isDraft) {
            overlayCtx.beginPath();
            overlayCtx.arc(p.x, p.y, hr * 3.5, 0, Math.PI * 2);
            overlayCtx.setLineDash([]);  // solid ring
            overlayCtx.strokeStyle = 'rgba(255,255,255,0.45)';
            overlayCtx.lineWidth   = lw;
            overlayCtx.stroke();
            overlayCtx.setLineDash([dashLen, dashLen]);  // restore dash for next iteration
        }
    });
}

function handlePolygonDown(x, y) {
    if (polygonPts.length >= 3) {
        const rect  = canvas.getBoundingClientRect();
        const snapT = 15 * (canvas.width / rect.width);
        if (Math.hypot(x - polygonPts[0].x, y - polygonPts[0].y) < snapT) {
            commitPolygon(); return;
        }
    }
    polygonPts.push({ x, y });
    drawPolygonPreview(x, y);
}

function commitPolygon() {
    if (polygonPts.length < 3) { cancelPolygon(); return; }
    // Enter adjust mode — do NOT fill yet
    pendingShape = {
        type:  'polygon',
        pts:   polygonPts.map(p => ({ ...p })),
        color: colorPicker.value
    };
    polygonPts = [];
    drawPendingShape();
    updateAdjustUI();
}

function cancelPolygon() {
    polygonPts         = [];
    polygonDraftActive = false;
    if (!pendingShape) clearOverlay();
}

/* ── Ellipse tool ─────────────────────────────────────────────── */
function drawEllipsePreview(ex, ey) {
    clearOverlay();
    if (!ellipseStart) return;
    const rx = Math.abs(ex - ellipseStart.x) / 2;
    const ry = Math.abs(ey - ellipseStart.y) / 2;
    if (rx < 1 || ry < 1) return;
    const lw      = Math.max(0.5, 1.5 / viewScale);
    const dashLen = Math.max(2, 5 / viewScale);
    overlayCtx.save();
    overlayCtx.lineWidth   = lw;
    overlayCtx.strokeStyle = 'rgba(255,255,255,0.9)';
    overlayCtx.setLineDash([dashLen, dashLen]);
    overlayCtx.shadowColor = 'rgba(0,0,0,0.55)';
    overlayCtx.shadowBlur  = 3 / viewScale;
    overlayCtx.beginPath();
    overlayCtx.ellipse(
        (ex + ellipseStart.x) / 2, (ey + ellipseStart.y) / 2,
        rx, ry, 0, 0, Math.PI * 2);
    overlayCtx.stroke();
    overlayCtx.restore();
}

function commitEllipse(ex, ey) {
    if (!ellipseStart) return;
    const rx = Math.abs(ex - ellipseStart.x) / 2;
    const ry = Math.abs(ey - ellipseStart.y) / 2;
    if (rx >= 2 && ry >= 2) {
        // Enter adjust mode — do NOT fill yet
        pendingShape = {
            type:  'ellipse',
            cx:    (ex + ellipseStart.x) / 2,
            cy:    (ey + ellipseStart.y) / 2,
            rx, ry,
            color: colorPicker.value
        };
        drawPendingShape();
        updateAdjustUI();
    }
    ellipseStart = null;
    isDrawing    = false;
}

/* ── View: zoom & pan ────────────────────────────────────────── */
function applyView() {
    canvasWrap.style.transform = `translate(${viewX}px, ${viewY}px) scale(${viewScale})`;
    const stZoom = document.getElementById('st-zoom');
    if (stZoom) stZoom.textContent = Math.round(viewScale * 100) + '%';
}

// Fit the image to the visible area and center it.
function initView() {
    const areaW = canvasArea.clientWidth;
    const areaH = canvasArea.clientHeight;
    const s = Math.min((areaW - 40) / canvas.width, (areaH - 40) / canvas.height, 1);
    viewScale = Math.max(s, 0.05);
    viewX = (areaW - canvas.width  * viewScale) / 2;
    viewY = (areaH - canvas.height * viewScale) / 2;
    applyView();
}

/* ── Pointer event handlers ───────────────────────────────────── */
function onDown(e) {
    if (!imageLoaded) return;
    if (e.button !== 0) return;  // ignore right-click (button=2) and middle-click (button=1)
    e.preventDefault();
    const { x, y } = getPos(e);
    lastKnownPos = { x, y };

    // ── Adjust mode: drag a handle on the pending shape ──────────
    if (pendingShape) {
        const idx = hitTestHandles(x, y);
        if (idx !== -1) {
            adjustDragIdx   = idx;
            adjustDragStart = { x, y };
            adjustOrigShape = JSON.parse(JSON.stringify(pendingShape));
            isDrawing = true;
        }
        return;  // ignore clicks outside handles while a shape is pending
    }

    if (currentTool === 'bucket') {
        floodFill(x, y);
    } else if (currentTool === 'brush') {
        saveState();
        isDrawing = true;
        lastPos   = null;
        drawBrush(x, y);
    } else if (currentTool === 'polygon') {
        handlePolygonDown(x, y);
    } else if (currentTool === 'ellipse') {
        ellipseStart = { x, y };
        isDrawing    = true;
    }
}

function onMove(e) {
    if (!imageLoaded) return;
    const pos = getPos(e);
    lastKnownPos = { x: pos.x, y: pos.y };
    stPos.textContent = `${pos.x} × ${pos.y}`;

    // ── Adjust mode ──────────────────────────────────────────────
    if (pendingShape) {
        if (isDrawing && adjustDragIdx !== -1) {
            e.preventDefault();
            applyAdjustDrag(pos.x, pos.y);
            drawPendingShape();
        } else if (!e.touches) {
            canvas.style.cursor = hitTestHandles(pos.x, pos.y) !== -1 ? 'grab' : 'default';
        }
        return;
    }

    // Desktop brush cursor ring
    if (currentTool === 'brush' && !e.touches) {
        const sz = Number(sizeRange.value);
        brushCursor.style.width   = sz + 'px';
        brushCursor.style.height  = sz + 'px';
        brushCursor.style.left    = pos.cx + 'px';
        brushCursor.style.top     = pos.cy + 'px';
        brushCursor.style.display = 'block';
    }

    if (isDrawing && currentTool === 'brush') {
        e.preventDefault();
        drawBrush(pos.x, pos.y);
    } else if (isDrawing && currentTool === 'ellipse' && ellipseStart) {
        e.preventDefault();
        drawEllipsePreview(pos.x, pos.y);
    } else if (currentTool === 'polygon' && polygonPts.length > 0 && !e.touches) {
        // Ghost line from last placed point to cursor (desktop only)
        drawPolygonPreview(pos.x, pos.y);
    }
}

function onUp() {
    // ── Finish adjust drag ───────────────────────────────────────
    if (adjustDragIdx !== -1) {
        adjustDragIdx   = -1;
        adjustDragStart = null;
        adjustOrigShape = null;
        isDrawing = false;
        if (pendingShape && !navigator.maxTouchPoints) canvas.style.cursor = 'default';
        return;
    }
    if (currentTool === 'ellipse' && isDrawing && ellipseStart && lastKnownPos) {
        commitEllipse(lastKnownPos.x, lastKnownPos.y);
    } else {
        isDrawing = false;
        lastPos   = null;
    }
}

function onLeave() {
    if (pendingShape) {
        // Finish any adjust drag that was in progress
        if (adjustDragIdx !== -1) {
            adjustDragIdx = -1; adjustDragStart = null; adjustOrigShape = null;
            isDrawing = false;
        }
        canvas.style.cursor = 'default';
    } else if (currentTool === 'polygon' && polygonPts.length > 0) {
        drawPolygonPreview(null, null);  // hide ghost line, keep placed points
    } else {
        onUp();
    }
    brushCursor.style.display = 'none';
    stPos.textContent = '';
}

// Mouse
canvas.addEventListener('mousedown',  onDown);
canvas.addEventListener('mousemove',  onMove);
canvas.addEventListener('mouseup',    onUp);
canvas.addEventListener('mouseleave', onLeave);

// Cancel any in-progress drawing when the browser context menu opens
// (right-click on desktop, long-press on mobile) so no ghost stroke is left behind.
canvas.addEventListener('contextmenu', () => {
    isDrawing    = false;
    lastPos      = null;
    ellipseStart = null;
    if (adjustDragIdx !== -1) {
        adjustDragIdx = -1; adjustDragStart = null; adjustOrigShape = null;
    }
    // Do NOT call e.preventDefault() — the whole point is to let the menu appear
});

// Touch — 1 finger = draw / fill / polygon / adjust; 2 fingers = pinch-zoom + pan
// Note: e.preventDefault() is intentionally NOT called on touchstart.
// touch-action:none CSS already blocks scroll/zoom without it, and omitting it
// allows the browser's long-press context menu to appear on mobile.
canvas.addEventListener('touchstart', e => {
    if (e.touches.length === 1) {
        const { x, y } = getPos(e);
        lastKnownPos = { x, y };

        // Double-tap: apply pending shape OR close polygon OR reset view
        const wasDoubleTap = !!tapTimer;
        if (tapTimer) { clearTimeout(tapTimer); tapTimer = null; }
        tapTimer = setTimeout(() => { tapTimer = null; }, 300);

        if (wasDoubleTap) {
            if (pendingShape)                                   { applyPendingShape(); return; }
            if (currentTool === 'polygon' && polygonPts.length >= 3) { commitPolygon(); return; }
            if (currentTool !== 'polygon')                      { initView(); return; }
        }

        // Adjust mode: hit-test handles
        if (pendingShape) {
            const idx = hitTestHandles(x, y);
            if (idx !== -1) {
                adjustDragIdx   = idx;
                adjustDragStart = { x, y };
                adjustOrigShape = JSON.parse(JSON.stringify(pendingShape));
                isDrawing = true;
            }
            return;
        }

        if (currentTool === 'bucket') {
            floodFill(x, y);
        } else if (currentTool === 'brush') {
            saveState();
            isDrawing = true;
            lastPos   = null;
            drawBrush(x, y);
        } else if (currentTool === 'polygon') {
            // Check snap-to-close BEFORE adding a draft point
            if (polygonPts.length >= 3) {
                const rect  = canvas.getBoundingClientRect();
                const snapT = 15 * (canvas.width / rect.width);
                if (Math.hypot(x - polygonPts[0].x, y - polygonPts[0].y) < snapT) {
                    commitPolygon(); return;
                }
            }
            // Push a draft point — touchmove can drag it before touchend commits it
            polygonPts.push({ x, y });
            polygonDraftActive = true;
            drawPolygonPreview(x, y);
        } else if (currentTool === 'ellipse') {
            ellipseStart = { x, y };
            isDrawing    = true;
        }
    } else if (e.touches.length >= 2) {
        // Two fingers: cancel any active stroke/shape, start pinch/pan
        if (polygonDraftActive) polygonDraftActive = false;  // commit draft at current position
        if (currentTool === 'ellipse' && isDrawing && !pendingShape) { ellipseStart = null; clearOverlay(); }
        if (adjustDragIdx !== -1) { adjustDragIdx = -1; adjustDragStart = null; adjustOrigShape = null; }
        isDrawing = false;
        lastPos   = null;
        prevPinch = { p1: e.touches[0], p2: e.touches[1] };
    }
}, { passive: false });

canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    if (e.touches.length === 1) {
        const { x, y } = getPos(e);
        lastKnownPos = { x, y };
        if (pendingShape && isDrawing && adjustDragIdx !== -1) {
            applyAdjustDrag(x, y);
            drawPendingShape();
        } else if (polygonDraftActive && currentTool === 'polygon' && polygonPts.length > 0) {
            // Drag the most recently placed point to fine-tune its position before committing
            polygonPts[polygonPts.length - 1] = { x, y };
            drawPolygonPreview(x, y);
        } else if (isDrawing && currentTool === 'brush') {
            drawBrush(x, y);
        } else if (isDrawing && currentTool === 'ellipse' && ellipseStart) {
            drawEllipsePreview(x, y);
        }
    } else if (e.touches.length >= 2 && prevPinch) {
        isDrawing = false;
        lastPos   = null;
        const t1 = e.touches[0], t2 = e.touches[1];
        const curDist  = Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
        const prevDist = Math.hypot(
            prevPinch.p2.clientX - prevPinch.p1.clientX,
            prevPinch.p2.clientY - prevPinch.p1.clientY
        );
        const ds = curDist / prevDist;
        const prevMidX = (prevPinch.p1.clientX + prevPinch.p2.clientX) / 2;
        const prevMidY = (prevPinch.p1.clientY + prevPinch.p2.clientY) / 2;
        const curMidX  = (t1.clientX + t2.clientX) / 2;
        const curMidY  = (t1.clientY + t2.clientY) / 2;
        const areaRect = canvasArea.getBoundingClientRect();
        const pmx = prevMidX - areaRect.left, pmy = prevMidY - areaRect.top;
        const cmx = curMidX  - areaRect.left, cmy = curMidY  - areaRect.top;
        viewX = cmx - (pmx - viewX) * ds;
        viewY = cmy - (pmy - viewY) * ds;
        viewScale = Math.min(Math.max(viewScale * ds, 0.05), 20);
        applyView();
        prevPinch = { p1: t1, p2: t2 };
    }
}, { passive: false });

canvas.addEventListener('touchend', e => {
    if (e.touches.length === 0) {
        if (polygonDraftActive) {
            // Commit the draft point at wherever the finger was lifted
            polygonDraftActive = false;
            drawPolygonPreview(null, null);  // redraw without draft indicator
        } else if (adjustDragIdx !== -1) {
            adjustDragIdx = -1; adjustDragStart = null; adjustOrigShape = null;
            isDrawing = false;
        } else if (currentTool === 'ellipse' && isDrawing && ellipseStart && lastKnownPos) {
            commitEllipse(lastKnownPos.x, lastKnownPos.y);
        } else {
            isDrawing = false;
            lastPos   = null;
        }
    }
    if (e.touches.length < 2) prevPinch = null;
});
canvas.addEventListener('touchcancel', () => {
    isDrawing = false; lastPos = null; prevPinch = null;
    polygonDraftActive = false;
    adjustDragIdx = -1; adjustDragStart = null; adjustOrigShape = null;
    ellipseStart = null;
    if (!pendingShape) clearOverlay();
});

/* ── Mouse-wheel zoom ─────────────────────────────────────────── */
canvasArea.addEventListener('wheel', e => {
    e.preventDefault();
    const ds = e.deltaY < 0 ? 1.12 : 1 / 1.12;
    const areaRect = canvasArea.getBoundingClientRect();
    const mx = e.clientX - areaRect.left;
    const my = e.clientY - areaRect.top;
    viewX = mx - (mx - viewX) * ds;
    viewY = my - (my - viewY) * ds;
    viewScale = Math.min(Math.max(viewScale * ds, 0.05), 20);
    applyView();
}, { passive: false });

/* ── Drag & drop ──────────────────────────────────────────────── */
['dragenter', 'dragover'].forEach(evt =>
    canvasArea.addEventListener(evt, e => {
        e.preventDefault();
        canvasArea.classList.add('drag-over');
    })
);
['dragleave', 'drop'].forEach(evt =>
    canvasArea.addEventListener(evt, e => {
        e.preventDefault();
        canvasArea.classList.remove('drag-over');
    })
);
canvasArea.addEventListener('drop', e => {
    e.preventDefault();
    canvasArea.classList.remove('drag-over');
    if (e.dataTransfer.files[0]) loadImage(e.dataTransfer.files[0]);
});

/* ── Download ─────────────────────────────────────────────────── */
function download() {
    if (!imageLoaded) return;
    const a    = document.createElement('a');
    a.download = 'bilde-fargeapp.png';
    a.href     = canvas.toDataURL('image/png');
    a.click();
}

/* ── Tool switching ───────────────────────────────────────────── */
const TOOL_HINTS = {
    bucket:  'Tool: Bucket fill',
    brush:   'Tool: Brush',
    polygon: 'Tool: Polygon — click/tap to place points · snap to start or Enter to fill · Esc to cancel',
    ellipse: 'Tool: Ellipse — drag to draw'
};

function setTool(tool) {
    // Cancel any in-progress or pending shapes
    cancelPendingShape();
    if (currentTool === 'polygon') cancelPolygon();
    if (currentTool === 'ellipse') { ellipseStart = null; isDrawing = false; clearOverlay(); }

    currentTool = tool;
    btnBucket.classList.toggle('active',  tool === 'bucket');
    btnBrush.classList.toggle('active',   tool === 'brush');
    btnPolygon.classList.toggle('active', tool === 'polygon');
    btnEllipse.classList.toggle('active', tool === 'ellipse');

    ctrlTolerance.style.display = tool === 'bucket' ? '' : 'none';
    ctrlBrush.style.display     = tool === 'brush'  ? '' : 'none';

    canvas.classList.toggle('brush-mode', tool === 'brush');
    canvas.style.cursor = '';
    brushCursor.style.display = 'none';
    stTool.textContent = TOOL_HINTS[tool] || tool;
}

/* ── UI refresh ───────────────────────────────────────────────── */
function refresh() {
    btnUndo.disabled     = undoStack.length === 0;
    btnRedo.disabled     = redoStack.length === 0;
    btnDownload.disabled = !imageLoaded;
    stSize.textContent   = imageLoaded
        ? canvas.width + ' × ' + canvas.height + ' px'
        : 'No image loaded';
    const n = undoStack.length;
    stUndo.textContent = imageLoaded
        ? n + ' undo step' + (n !== 1 ? 's' : '')
        : '';
}

/* ── Button & input wiring ────────────────────────────────────── */
btnBucket.addEventListener('click',  () => setTool('bucket'));
btnBrush.addEventListener('click',   () => setTool('brush'));
btnPolygon.addEventListener('click', () => setTool('polygon'));
btnEllipse.addEventListener('click', () => setTool('ellipse'));

[btnUpload, btnPick].forEach(b => b.addEventListener('click', () => fileInput.click()));
fileInput.addEventListener('change', () => {
    if (fileInput.files[0]) loadImage(fileInput.files[0]);
    fileInput.value = '';   // reset so the same file can be reloaded
});

btnApply.addEventListener('click',       applyPendingShape);
btnCancelShape.addEventListener('click', cancelPendingShape);
btnUndo.addEventListener('click',     undo);
btnRedo.addEventListener('click',     redo);
btnDownload.addEventListener('click', download);

tolRange.addEventListener('input',  () => { tolOut.textContent     = tolRange.value; });
sizeRange.addEventListener('input', () => { sizeOut.textContent    = sizeRange.value; });
opacityRange.addEventListener('input', () => {
    opacityOut.textContent = opacityRange.value;
    if (pendingShape) drawPendingShape();  // live-preview opacity change on pending shape
});

/* ── Keyboard shortcuts ───────────────────────────────────────── */
document.addEventListener('keydown', e => {
    const ctrl = e.ctrlKey || e.metaKey;
    if (ctrl && !e.shiftKey && e.key === 'z') { e.preventDefault(); undo(); }
    if (ctrl && e.key === 'y')                 { e.preventDefault(); redo(); }
    if (ctrl && e.shiftKey && e.key === 'Z')   { e.preventDefault(); redo(); }
    if (ctrl && e.key === 'o')                 { e.preventDefault(); fileInput.click(); }
    if (ctrl && e.key === 's')                 { e.preventDefault(); download(); }
    if (!ctrl && !e.altKey && e.key === 'b')       { setTool('bucket'); }
    if (!ctrl && !e.altKey && e.key === 'r')       { setTool('brush'); }
    if (!ctrl && !e.altKey && e.key === 'p')       { setTool('polygon'); }
    if (!ctrl && !e.altKey && e.key === 'e')       { setTool('ellipse'); }
    if (!ctrl && !e.altKey && e.key === 'f')       { initView(); }
    if (e.key === 'Escape') {
        if (pendingShape)                    cancelPendingShape();
        else if (currentTool === 'polygon') cancelPolygon();
    }
    if (e.key === 'Enter' && !e.isComposing) {
        if (pendingShape)                                            applyPendingShape();
        else if (currentTool === 'polygon' && polygonPts.length >= 3) commitPolygon();
    }
});

/* ── Init ─────────────────────────────────────────────────────── */
setTool('bucket');
refresh();
</script>
</body>
</html>
